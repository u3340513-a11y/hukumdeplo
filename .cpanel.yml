---
# ─────────────────────────────────────────────────────────────────────────────
# cPanel Git Version Control — Deploy Sonrası Görevler
# vendor/ repoya dahil — composer install GEREKMİYOR
# ─────────────────────────────────────────────────────────────────────────────

deployment:
  tasks:
    # 1. .env yoksa .env.example'dan oluştur (ilk deploy'da otomatik çalışır)
    - "[ -f core/.env ] || cp core/.env.example core/.env"

    # 2. storage ve cache dizin izinlerini düzelt
    - chmod -R 775 core/storage core/bootstrap/cache

    # 3. Laravel config/route/view cache temizle ve yeniden oluştur
    - /usr/local/bin/php core/artisan config:clear --quiet 2>/dev/null || true
    - /usr/local/bin/php core/artisan config:cache --quiet
    - /usr/local/bin/php core/artisan route:cache --quiet
    - /usr/local/bin/php core/artisan view:cache --quiet

    # 4. Storage link (storage/app/public → public/storage)
    - /usr/local/bin/php core/artisan storage:link --force --quiet 2>/dev/null || true
