---
# ─────────────────────────────────────────────────────────────────────────────
# cPanel Git Version Control — Deploy Sonrası Görevler
# vendor/ repoya dahil — composer install GEREKMİYOR
# ─────────────────────────────────────────────────────────────────────────────

deployment:
  tasks:
    # 1. .env yoksa .env.example'dan oluştur (ilk deploy'da otomatik çalışır)
    #    NOT: İlk deploy'dan sonra cPanel File Manager'dan core/.env içindeki
    #         DB_PASSWORD değerini gerçek şifreyle doldurun.
    - "[ -f core/.env ] || cp core/.env.example core/.env"

    # 2. storage ve cache dizin izinlerini düzelt
    - chmod -R 775 core/storage core/bootstrap/cache

    # 3. TÜM önbellekleri temizle (stale cache sorunlarını önler)
    - /usr/local/bin/php core/artisan optimize:clear 2>&1 || true

    # 4. Paket keşfi — packages.php ve services.php oluştur
    - /usr/local/bin/php core/artisan package:discover --ansi 2>&1 || true

    # 5. Laravel config/route/view cache oluştur
    - /usr/local/bin/php core/artisan config:cache 2>&1
    - /usr/local/bin/php core/artisan route:cache 2>&1
    - /usr/local/bin/php core/artisan view:cache 2>&1

    # 6. Storage link (storage/app/public → public/storage)
    - /usr/local/bin/php core/artisan storage:link --force 2>&1 || true
